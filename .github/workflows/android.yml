name: Android APK

on:
  push:
    paths-ignore:
      - 'keystore/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  KEYSTORE_PASSWORD: nooxe-signing-2026-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        run: |
          set -e
          if [ ! -f keystore/nooxe-release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/nooxe-release.jks \
              -alias nooxe \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Nooxe, OU=Nooxe, O=Nooxe, L=Dhaka, C=BD"
            git config user.name "nooxe-builder"
            git config user.email "nooxe-builder@users.noreply.github.com"
            git add keystore/nooxe-release.jks
            git commit -m "Add the permanent signing key"
            git push
          fi

      - name: Build APK
        run: |
          set -e
          gradle assembleRelease --no-daemon -PbuildNumber=$GITHUB_RUN_NUMBER
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$SDK/build-tools/34.0.0"
          OUT=app/build/outputs/apk/release
          "$BT/zipalign" -f -p 4 "$OUT/app-release-unsigned.apk" "$OUT/Nooxe-aligned.apk"
          "$BT/apksigner" sign \
            --ks keystore/nooxe-release.jks \
            --ks-key-alias nooxe \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$OUT/Nooxe.apk" "$OUT/Nooxe-aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT/Nooxe.apk" | head -4 || true

      - name: Update the single release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=latest
          cp app/build/outputs/apk/release/Nooxe.apk Nooxe.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Nooxe.apk --clobber
          else
            gh release create "$TAG" Nooxe.apk --title "Nooxe Android" --latest
          fi
          gh release edit "$TAG" --notes "Nooxe Android - build #$GITHUB_RUN_NUMBER"
