plugins {
    id 'com.android.application'
}

def buildNo = (project.findProperty('buildNumber') ?: '1').toString().toInteger()

android {
    namespace 'com.nooxe.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nooxe.app'
        minSdk 24
        targetSdk 34
        versionCode buildNo
        versionName '1.0.' + buildNo
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
